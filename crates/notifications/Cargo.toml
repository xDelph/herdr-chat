[package]
name = "notifications"
description = "Legacy-compatible push store, VAPID lifecycle, payload naming, delivery with expired-subscription pruning"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# ⚠️ **Vendored, et pas par confort.** Le binaire de release liait l'OpenSSL
# de Homebrew (`/opt/homebrew/opt/openssl@4`) : l'archive n'aurait pas démarré
# sur une machine sans Homebrew. Prouvé par `xtask release` (T066), qui refuse
# un binaire liant `libssl`/`libcrypto` système.
openssl = { version = "0.10", features = ["vendored"] }
serde = { workspace = true }
base64 = { workspace = true }
jwt-simple = { version = "0.12.11", default-features = false, features = ["pure-rust"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
web-push = { workspace = true, features = ["hyper-client"] }
domain = { path = "../domain" }
files = { path = "../files" }

[lints]
workspace = true

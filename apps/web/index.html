    <!-- ecrans-demarrage:fin -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Herdr Chat</title>
    <!--
      ⚠️ L'écran de démarrage, AVANT le JavaScript : le même dessin que les
      écrans de lancement iOS (scripts/ecrans-demarrage.sh) — fond de l'app,
      icône arrondie de 88 pt au centre. iOS passe de son image à cette page
      sans saut ; React le remplace par le squelette de la liste.
      Le thème choisi dans les réglages est posé ici, avant la première
      peinture : sinon un thème forcé clignotait au démarrage.
    -->
    <script>
      try {
        var theme = localStorage.getItem("herdr-chat.theme");
        if (theme === "clair") document.documentElement.dataset.theme = "light";
        if (theme === "sombre") document.documentElement.dataset.theme = "dark";
      } catch (erreur) {}
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f1f2f4;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]),
        html:not([data-theme="light"]) body {
          background: #0c0e12;
        }
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0c0e12;
      }
      .demarrage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .demarrage img {
        width: 88px;
        height: 88px;
        animation: demarrage-respire 1.6s ease-in-out 0.6s infinite;
      }
      @keyframes demarrage-respire {
        50% {
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .demarrage img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="demarrage" aria-hidden="true">
        <img src="/icone-demarrage.png" alt="" width="88" height="88" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

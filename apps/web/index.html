<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b1220" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Herdr Chat" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!--
      ⚠️ iOS n'utilise PAS le manifest pour l'icône d'accueil : sans cette
      balise, la PWA installée garde une vignette blanche même avec un manifest
      correct. C'est la seule ligne qui compte pour l'iPhone.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Herdr Chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Build-version cache control: transparent cache invalidation.
      // Each build has a unique ID. If the stored ID differs, clear all
      // caches and service workers, then reload. No manual ?reset=1 needed.
      (async () => {
        const buildId = "__BUILD_ID__";
        const stored = localStorage.getItem("herdr-build-id");
        if (stored !== null && stored !== buildId) {
          try {
            const regs = (await navigator.serviceWorker?.getRegistrations()) ?? [];
            await Promise.all(regs.map((r) => r.unregister()));
            const keys = (await caches?.keys()) ?? [];
            await Promise.all(keys.map((k) => caches.delete(k)));
          } catch (e) {}
          localStorage.setItem("herdr-build-id", buildId);
          window.location.reload();
          return;
        }
        localStorage.setItem("herdr-build-id", buildId);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
